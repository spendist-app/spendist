<!-- The live region stays in the DOM so a newly shown notice is announced. -->
<div
  class="toast toast-top toast-end top-20 z-[80] w-full max-w-sm px-4 pointer-events-none"
  role="status"
  aria-atomic="true"
>
  @if (notices.notice(); as notice) {
  <div
    class="pointer-events-auto alert grid grid-cols-[1fr_auto] items-start gap-3 rounded-2xl shadow-2xl"
    [class.alert-success]="notice.kind === 'success'"
    [class.alert-info]="notice.kind === 'info'"
  >
    <p class="font-medium">{{ notice.messageKey | transloco }}</p>
    <button
      type="button"
      class="btn btn-ghost btn-xs btn-circle"
      [attr.aria-label]="'common.actions.dismiss' | transloco"
      (click)="notices.dismiss()"
    >
      ✕
    </button>
  </div>
  }
</div>
