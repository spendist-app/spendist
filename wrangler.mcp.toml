name = "spendist-mcp"
main = "apps/mcp/src/worker.ts"
compatibility_date = "2026-08-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
MCP_RESOURCE_URL = "https://mcp.spendist.app/mcp"
MCP_ALLOWED_AUDIENCE = "https://mcp.spendist.app/mcp"
MCP_ALLOWED_HOSTS = "mcp.spendist.app"

[[routes]]
pattern = "mcp.spendist.app/*"
zone_name = "spendist.app"

# SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, and MCP_OAUTH_ISSUER are environment
# secrets/vars configured in Cloudflare. Early production access is limited to
# a small pilot group and expanded only after its OAuth and mutation checks pass.
