worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/nginx/client-body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    location = /env.js {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store, max-age=0" always;
      try_files $uri =404;
    }

    location ~ ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      try_files $uri =404;
    }

    location ~ ^/llm(?:-full)?\.txt$ {
      default_type text/plain;
      charset utf-8;
      try_files $uri =404;
    }

    location = /llms.txt {
      default_type text/plain;
      charset utf-8;
      try_files /llm.txt =404;
    }

    location = /llms-full.txt {
      default_type text/plain;
      charset utf-8;
      try_files /llm-full.txt =404;
    }

    location ~ ^/pl/blog(?:/|$) {
      error_page 404 =404 /pl/blog-not-found/index.html;
      try_files $uri/index.html $uri $uri/ =404;
    }

    location ~ ^/en/blog(?:/|$) {
      error_page 404 =404 /en/blog-not-found/index.html;
      try_files $uri/index.html $uri $uri/ =404;
    }

    location ~* \.(?:avif|css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location / {
      try_files $uri/index.html $uri $uri/ /index.html;
    }
  }
}
