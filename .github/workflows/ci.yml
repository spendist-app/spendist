name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Lint
        run: npx nx lint web

      - name: Unit tests
        run: npx nx test web -- --runInBand

      - name: E2E tests
        run: npx nx e2e web-e2e
