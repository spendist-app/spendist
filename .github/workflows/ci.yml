name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Blog content and SEO artifacts
        run: npm run blog:check

      - name: Lint
        run: npx nx lint web

      - name: Unit tests
        run: npx nx test web

  e2e:
    if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    env:
      E2E_ENV_FILE: .local_env.e2e
      E2E_DB_RESET_ATTEMPTS: '5'
      E2E_SKIP_DB_RESET_SETUP: 'true'
      E2E_SKIP_DB_RESET_TEARDOWN: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Export local Supabase credentials
        run: |
          supabase status -o env > "$E2E_ENV_FILE"

          get_env_value() {
            local key="$1"
            grep -E "^${key}=" "$E2E_ENV_FILE" | tail -n1 | cut -d= -f2- || true
          }

          supabase_url="$(get_env_value NG_APP_SUPABASE_URL)"
          if [ -z "$supabase_url" ]; then supabase_url="$(get_env_value API_URL)"; fi
          if [ -z "$supabase_url" ]; then supabase_url="$(get_env_value SUPABASE_URL)"; fi

          supabase_key="$(get_env_value NG_APP_SUPABASE_PUBLISHABLE_KEY)"
          if [ -z "$supabase_key" ]; then supabase_key="$(get_env_value NG_APP_SUPABASE_ANON_KEY)"; fi
          if [ -z "$supabase_key" ]; then supabase_key="$(get_env_value PUBLISHABLE_KEY)"; fi
          if [ -z "$supabase_key" ]; then supabase_key="$(get_env_value ANON_KEY)"; fi
          if [ -z "$supabase_key" ]; then supabase_key="$(get_env_value SUPABASE_PUBLISHABLE_KEY)"; fi
          if [ -z "$supabase_key" ]; then supabase_key="$(get_env_value SUPABASE_ANON_KEY)"; fi

          e2e_db_url="$(get_env_value SUPABASE_E2E_DB_URL)"
          if [ -z "$e2e_db_url" ]; then e2e_db_url="$(get_env_value DB_URL)"; fi
          if [ -z "$e2e_db_url" ]; then e2e_db_url="$(get_env_value SUPABASE_DB_URL)"; fi

          {
            echo "SUPABASE_URL=$supabase_url"
            echo "SUPABASE_ANON_KEY=$supabase_key"
            echo "NG_APP_SUPABASE_URL=$supabase_url"
            echo "NG_APP_SUPABASE_PUBLISHABLE_KEY=$supabase_key"
            echo "NG_APP_SUPABASE_ANON_KEY=$supabase_key"
            echo "SUPABASE_E2E_DB_URL=$e2e_db_url"
          } >> "$E2E_ENV_FILE"

          if [ -z "$supabase_url" ] || [ -z "$supabase_key" ] || [ -z "$e2e_db_url" ]; then
            echo "Error: Missing required Supabase env vars in $E2E_ENV_FILE" >&2
            echo "Available keys:" >&2
            cut -d= -f1 "$E2E_ENV_FILE" | sort -u >&2
            exit 1
          fi

      - name: Wait for recurring payments Edge Function
        run: |
          set -a
          source "$E2E_ENV_FILE"
          set +a

          edge_runtime_container="supabase_edge_runtime_spendist-app"
          if docker inspect "$edge_runtime_container" >/dev/null 2>&1 && \
            [ "$(docker inspect --format '{{.State.Running}}' "$edge_runtime_container")" != "true" ]; then
            docker start "$edge_runtime_container"
          fi

          function_url="${SUPABASE_URL%/}/functions/v1/process-recurring-payments"
          for attempt in $(seq 1 60); do
            http_status="$(curl --silent --show-error \
              --output /tmp/process-recurring-payments-health.txt \
              --write-out '%{http_code}' \
              --header "apikey: $SUPABASE_ANON_KEY" \
              "$function_url" || true)"

            if [ "$http_status" = "405" ]; then
              echo "Recurring payments Edge Function is ready."
              break
            fi

            if [ "$attempt" = "60" ]; then
              echo "Edge Function did not become ready (last HTTP status: $http_status)." >&2
              docker ps -a --filter "name=$edge_runtime_container" >&2
              docker logs --tail=200 "$edge_runtime_container" >&2 || true
              exit 1
            fi

            sleep 2
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: E2E tests
        env:
          E2E_ENV_FILE: ${{ env.E2E_ENV_FILE }}
        run: npx nx e2e web-e2e -- --project=chromium

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop --no-backup
