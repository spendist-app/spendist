name: Production Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_REMOTE_DB_URL: ${{ secrets.SUPABASE_REMOTE_DB_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PRODUCTION_URL: ${{ secrets.CLOUDFLARE_PRODUCTION_URL }}
      NG_APP_SUPABASE_URL: ${{ secrets.NG_APP_SUPABASE_URL }}
      NG_APP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NG_APP_SUPABASE_PUBLISHABLE_KEY }}
      NG_APP_SUPABASE_FUNCTIONS_URL: ${{ secrets.NG_APP_SUPABASE_FUNCTIONS_URL }}
      RECURRING_PAYMENTS_SECRET: ${{ secrets.RECURRING_PAYMENTS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify app
        run: |
          npx nx lint web
          npx nx test web
          npx nx build web --configuration production

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push production DB migrations
        run: supabase db push --db-url "$SUPABASE_REMOTE_DB_URL"

      - name: Deploy Supabase Edge Functions
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Missing required GitHub secret: SUPABASE_PROJECT_REF"
            exit 1
          fi

          supabase functions deploy process-recurring-payments \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Sync Supabase Edge Function Secrets
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Missing required GitHub secret: SUPABASE_PROJECT_REF"
            exit 1
          fi

          if [ -z "$RECURRING_PAYMENTS_SECRET" ]; then
            echo "::error::Missing required GitHub secret: RECURRING_PAYMENTS_SECRET"
            exit 1
          fi

          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            RECURRING_PAYMENTS_SECRET="$RECURRING_PAYMENTS_SECRET"

      - name: Write production runtime env
        run: |
          supabase_url="$NG_APP_SUPABASE_URL"
          publishable_key="${NG_APP_SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}}"

          if [ -z "$supabase_url" ]; then
            echo "::error::Missing required GitHub secret: NG_APP_SUPABASE_URL"
            exit 1
          fi

          if [ -z "$publishable_key" ]; then
            echo "::error::Missing required GitHub secret: NG_APP_SUPABASE_PUBLISHABLE_KEY"
            echo "::notice::Temporary fallback is SUPABASE_PUBLISHABLE_KEY or SUPABASE_ANON_KEY."
            exit 1
          fi

          if [ -z "$NG_APP_SUPABASE_FUNCTIONS_URL" ]; then
            functions_url="${supabase_url%/}/functions/v1"
            echo "::notice::NG_APP_SUPABASE_FUNCTIONS_URL not provided; deriving from NG_APP_SUPABASE_URL."
          else
            functions_url="$NG_APP_SUPABASE_FUNCTIONS_URL"
          fi

          env_payload="$(jq -cn \
            --arg supabaseUrl "$supabase_url" \
            --arg publishableKey "$publishable_key" \
            --arg functionsUrl "$functions_url" \
            '{
              SUPABASE_URL: $supabaseUrl,
              SUPABASE_ANON_KEY: $publishableKey,
              SUPABASE_PUBLISHABLE_KEY: $publishableKey,
              NG_APP_SUPABASE_URL: $supabaseUrl,
              NG_APP_SUPABASE_PUBLISHABLE_KEY: $publishableKey,
              NG_APP_SUPABASE_ANON_KEY: $publishableKey,
              NG_APP_SUPABASE_FUNCTIONS_URL: $functionsUrl
            }')"

          {
            printf 'globalThis.__env = %s;\n' "$env_payload"
            printf 'globalThis.env = globalThis.__env;\n'
          } > apps/web/public/env.js

      - name: Build Cloudflare Worker assets
        run: npm run build:worker

      - name: Deploy Cloudflare Worker
        run: npm run deploy:worker

      - name: Sync Cloudflare Worker Secrets
        run: |
          publishable_key="${NG_APP_SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}}"

          if [ -z "$NG_APP_SUPABASE_URL" ]; then
            echo "::error::Missing required GitHub secret: NG_APP_SUPABASE_URL"
            exit 1
          fi

          if [ -z "$publishable_key" ]; then
            echo "::error::Missing required GitHub secret: NG_APP_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

          if [ -z "$NG_APP_SUPABASE_FUNCTIONS_URL" ]; then
            functions_url="${NG_APP_SUPABASE_URL%/}/functions/v1"
            echo "::notice::NG_APP_SUPABASE_FUNCTIONS_URL not provided; deriving from NG_APP_SUPABASE_URL."
          else
            functions_url="$NG_APP_SUPABASE_FUNCTIONS_URL"
          fi

          secrets_file="$(mktemp)"
          jq -n \
            --arg supabaseUrl "$NG_APP_SUPABASE_URL" \
            --arg publishableKey "$publishable_key" \
            --arg functionsUrl "$functions_url" \
            '{
              SUPABASE_URL: $supabaseUrl,
              SUPABASE_ANON_KEY: $publishableKey,
              SUPABASE_PUBLISHABLE_KEY: $publishableKey,
              NG_APP_SUPABASE_URL: $supabaseUrl,
              NG_APP_SUPABASE_PUBLISHABLE_KEY: $publishableKey,
              NG_APP_SUPABASE_ANON_KEY: $publishableKey,
              NG_APP_SUPABASE_FUNCTIONS_URL: $functionsUrl
            }' > "$secrets_file"

          npx --yes wrangler@4 secret bulk "$secrets_file" --config wrangler.toml
          rm -f "$secrets_file"

      - name: Verify Cloudflare runtime env
        run: |
          production_url="${CLOUDFLARE_PRODUCTION_URL:-https://spendist.app}"
          runtime_env="$(curl -fsS "${production_url%/}/env.js")"

          if echo "$runtime_env" | grep -q 'globalThis.__env = globalThis.__env || {}'; then
            echo "::error::Cloudflare runtime env is still serving the static placeholder."
            exit 1
          fi

          if ! echo "$runtime_env" | grep -Eq '"SUPABASE_URL"[[:space:]]*:[[:space:]]*"https://'; then
            echo "::error::Cloudflare runtime env is missing SUPABASE_URL."
            exit 1
          fi

          if ! echo "$runtime_env" | grep -Eq '"SUPABASE_PUBLISHABLE_KEY"[[:space:]]*:[[:space:]]*"[^"]+"|"SUPABASE_ANON_KEY"[[:space:]]*:[[:space:]]*"[^"]+"'; then
            echo "::error::Cloudflare runtime env is missing SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
