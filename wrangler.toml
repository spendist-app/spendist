name = "spendist-app"
main = "apps/web/worker.ts"
compatibility_date = "2026-02-01"

[[routes]]
pattern = "spendist.app/*"
zone_name = "spendist.app"

[assets]
directory = "dist/apps/web/browser"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
run_worker_first = ["/", "/index.html", "/index.csr.html", "/polityka-prywatnosci", "/polityka-prywatnosci/*", "/regulamin", "/regulamin/*", "/pl/blog", "/pl/blog/*", "/en/blog", "/en/blog/*", "/analytics/*"]
