name = "spendist-app"
main = "apps/web/worker.ts"
compatibility_date = "2026-02-01"
workers_dev = false

[[routes]]
pattern = "spendist.app/*"
zone_name = "spendist.app"

# Public Cloudflare Turnstile site key served in /env.js; the secret key is
# configured only in Supabase Auth (Attack Protection).
[vars]
NG_APP_TURNSTILE_SITE_KEY = "0x4AAAAAAFqG63T_7USadtr7"

[assets]
directory = "dist/apps/web/browser"
binding = "ASSETS"
# Match the extensionless URLs emitted by sitemap, canonical tags and RSS.
html_handling = "drop-trailing-slash"
not_found_handling = "none"
run_worker_first = true
